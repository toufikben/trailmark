name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew test --no-daemon --stacktrace

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore shared debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then echo "no shared debug keystore"; exit 0; fi
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > app/shared-debug.jks
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then echo "no release keystore"; exit 0; fi
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > app/release-keystore.jks
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Publish QA APK as a pre-release
        # Release assets do not count toward the Actions artifact storage
        # quota, so a manual build can always reach the test phone.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="qa-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" app/build/outputs/apk/debug/*.apk             --target "$GITHUB_SHA" --prerelease             --title "QA build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})"             --notes "Debug APK from ${GITHUB_SHA}."
      - name: Build Wear debug APK
        run: ./gradlew :wear:assembleDebug --no-daemon --stacktrace
      - name: Build signed release APK and AAB
        env:
          RELEASE_KEYSTORE_FILE: app/release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease :wear:assembleRelease --no-daemon --stacktrace
      - name: Verify release APKs are signed
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          test -f wear/build/outputs/apk/release/wear-release.apk
          if [ -n "$ANDROID_HOME" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
            "$APKSIGNER" verify --print-certs wear/build/outputs/apk/release/wear-release.apk
          fi
      - name: Attach the release APK and AAB to the QA pre-release
        # The QA release is what reaches the test phone, so the R8 build has to
        # land there too - a release that is never installed is never checked.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="qa-${GITHUB_RUN_NUMBER}"
          gh release upload "$tag"             app/build/outputs/apk/release/app-release.apk             app/build/outputs/bundle/release/app-release.aab             --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: trailmark-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: trailmark-wear-apk
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: trailmark-wear-release-apk
          path: wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: trailmark-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: trailmark-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
